<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101016;color:white;font:14px Arial}
header{height:60px;background:#191922;border-bottom:1px solid #383844;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.logo{font-size:20px;font-weight:bold;color:#b994ff}
button{background:#292936;color:white;border:1px solid #454554;border-radius:7px;padding:9px 13px;cursor:pointer}
button:hover{border-color:#a77aff}
.primary{background:#8955ee;border-color:#8955ee}
.layout{display:grid;grid-template-columns:220px 1fr 240px;grid-template-rows:minmax(350px,1fr) 260px;height:calc(100vh - 60px);gap:1px;background:#393944}
.panel{background:#1c1c25;overflow:auto;min-width:0}
.left{grid-column:1;grid-row:1}
.center{grid-column:2;grid-row:1;background:#111116;display:flex;flex-direction:column}
.right{grid-column:3;grid-row:1}
.timeline{grid-column:1/4;grid-row:2}
.heading{padding:15px;border-bottom:1px solid #393944;color:#c8c4d2;font-weight:bold}
.tabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px}
.tab.active{background:#6742a2}
.import{display:block;margin:12px;padding:25px 8px;text-align:center;border:1px dashed #9567d5;border-radius:10px;cursor:pointer;color:#d9c4ff}
input[type=file]{display:none}
.media{padding:12px;color:#aaa;overflow-wrap:anywhere}
.previewtop{padding:12px;color:#aaa;display:flex;justify-content:space-between}
.stage{flex:1;display:flex;justify-content:center;align-items:center;padding:15px;min-height:0}
.canvas{position:relative;background:#050505;width:min(100%,700px);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
video{width:100%;height:100%;object-fit:contain}
.empty{color:#888;text-align:center}
#caption{position:absolute;top:45%;left:5%;width:90%;text-align:center;font-size:28px;font-weight:bold;text-shadow:0 2px 8px black;pointer-events:none}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;padding:12px;border-top:1px solid #393944}
.field{padding:13px;border-bottom:1px solid #393944}
.field label{display:flex;justify-content:space-between;color:#ccc;font-size:12px;margin-bottom:10px}
input[type=range]{width:100%;accent-color:#a77aff}
input[type=text],select{width:100%;padding:9px;background:#111116;color:white;border:1px solid #454554;border-radius:6px}
.timelinebar{padding:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #393944;flex-wrap:wrap}
.tracks{padding:12px;overflow:auto}
.track{display:flex;align-items:center;gap:10px;margin:10px 0;min-width:550px}
.trackname{width:90px;color:#aaa;font-size:12px}
.clip{height:42px;flex:1;background:linear-gradient(90deg,#54377e,#9668d4);border-radius:6px;padding:13px;font-size:12px;overflow:hidden}
.emptyclip{background:#292934;border:1px dashed #555;color:#999}
.status{color:#c2a1ff;padding:8px 14px;font-size:12px}
@media(max-width:850px){
.layout{grid-template-columns:170px 1fr;grid-template-rows:430px 250px auto;height:auto}
.left{grid-column:1;grid-row:1}.center{grid-column:2;grid-row:1}
.right{grid-column:1/3;grid-row:3;display:grid;grid-template-columns:repeat(2,1fr)}
.right .heading{grid-column:1/3}.timeline{grid-column:1/3;grid-row:2}
}
@media(max-width:550px){
.layout{display:flex;flex-direction:column;height:auto}
.center{height:390px;order:1}.left{order:2}.timeline{height:250px;order:3}.right{display:block;order:4}
}
</style>
</head>
<body>
<header>
<div class="logo">✦ AI VIDEO STUDIO</div>
<div><button onclick="location.reload()">New Project</button>
<button class="primary" onclick="exportVideo()">Export</button></div>
</header>

<div class="layout">
<aside class="panel left">
<div class="heading">MEDIA LIBRARY</div>
<div class="tabs">
<button class="tab active" onclick="showTab('media',this)">Media</button>
<button class="tab" onclick="showTab('audio',this)">Audio</button>
<button class="tab" onclick="showTab('text',this)">Text</button>
<button class="tab" onclick="showTab('effects',this)">Effects</button>
</div>
<div id="mediaPane">
<label class="import" for="file">＋<br><b>Import Media</b><br><small>Video select karein</small></label>
<input id="file" type="file" accept="video/*">
<div class="media" id="filename">Your media will appear here.</div>
</div>
<div class="media" id="toolPane" hidden></div>
</aside>

<section class="panel center">
<div class="previewtop"><span>PLAYER / PREVIEW</span><span id="resolution">16:9</span></div>
<div class="stage">
<div class="canvas">
<div class="empty" id="empty">Import your video<br>Preview yahan dikhega</div>
<video id="video" hidden playsinline></video>
<div id="caption"></div>
</div>
</div>
<div class="controls">
<button onclick="seek(-5)">↶ 5s</button>
<button class="primary" onclick="playVideo()" id="play">▶ Play</button>
<button onclick="seek(5)">5s ↷</button>
<span id="clock">00:00 / 00:00</span>
</div>
<div class="status" id="status">Ready — Import video to start.</div>
</section>

<aside class="panel right">
<div class="heading">EDIT PROPERTIES</div>
<div class="field"><label>Trim Start <b id="sv">0.0s</b></label><input id="start" type="range" min="0" max="0" step=".1" value="0"></div>
<div class="field"><label>Trim End <b id="ev">0.0s</b></label><input id="end" type="range" min="0" max="0" step=".1" value="0"></div>
<div class="field"><label>Speed <b id="speedv">1x</b></label><input id="speed" type="range" min=".25" max="2" step=".05" value="1"></div>
<div class="field"><label>Volume <b id="volv">100%</b></label><input id="volume" type="range" min="0" max="1" step=".05" value="1"></div>
<div class="field"><label>Rotation</label><select id="rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></div>
<div class="field"><label>Filter</label><select id="filter"><option value="none">Original</option><option value="grayscale(1)">Black & White</option><option value="sepia(.8)">Vintage</option><option value="contrast(1.3) saturate(1.3)">Vivid</option><option value="brightness(1.15)">Bright</option></select></div>
<div class="field"><label>Text Overlay</label><input id="text" type="text" placeholder="Type your title"></div>
</aside>

<section class="panel timeline">
<div class="timelinebar"><b>TIMELINE</b><button onclick="splitClip()">✂ Split</button><button onclick="deleteClip()">Delete Clip</button></div>
<div class="tracks">
<div class="track"><span class="trackname">🎬 VIDEO</span><div class="clip emptyclip" id="videoClip">Import video to begin</div></div>
<div class="track"><span class="trackname">🔤 TEXT</span><div class="clip emptyclip" id="textClip">Text track</div></div>
<div class="track"><span class="trackname">♫ AUDIO</span><div class="clip emptyclip">Audio track — coming next</div></div>
</div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const v=$('video');
let videoURL='',videoName='',splits=[];

function message(t){$('status').textContent=t}
function time(n){if(!Number.isFinite(n))return '00:00';return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')}
function updateClock(){$('clock').textContent=time(v.currentTime)+' / '+time(v.duration)}
function labels(){
$('sv').textContent=(+$('start').value).toFixed(1)+'s';
$('ev').textContent=(+$('end').value).toFixed(1)+'s';
$('speedv').textContent=$('speed').value+'x';
$('volv').textContent=Math.round(+$('volume').value*100)+'%';
}
$('file').onchange=()=>{
const f=$('file').files[0];if(!f)return;
if(videoURL)URL.revokeObjectURL(videoURL);
videoURL=URL.createObjectURL(f);videoName=f.name;
v.src=videoURL;v.hidden=false;$('empty').hidden=true;
$('filename').textContent='🎞 '+f.name;
v.onloadedmetadata=()=>{
$('start').max=$('end').max=v.duration;
$('start').value=0;$('end').value=v.duration;
$('videoClip').textContent=f.name;
$('videoClip').classList.remove('emptyclip');
$('resolution').textContent=v.videoWidth+' × '+v.videoHeight;
labels();updateClock();message('Video ready! Editing shuru karein.');
};
};
$('start').oninput=()=>{
if(+$('start').value>=+$('end').value)$('start').value=Math.max(0,+$('end').value-.1);
labels();
};
$('end').oninput=()=>{
if(+$('end').value<=+$('start').value)$('end').value=Math.min(v.duration,+$('start').value+.1);
labels();
};
$('speed').oninput=()=>{v.playbackRate=+$('speed').value;labels()};
$('volume').oninput=()=>{v.volume=+$('volume').value;labels()};
$('rotation').onchange=()=>{v.style.transform='rotate('+$('rotation').value+'deg)'};
$('filter').onchange=()=>{v.style.filter=$('filter').value};
$('text').oninput=()=>{$('caption').textContent=$('text').value;$('textClip').textContent=$('text').value||'Text track'};
async function playVideo(){
    if(!v.src){
        message('Pehle video import karein.');
        return;
    }

    try{
        if(v.paused){
            await v.play();
            $('#play').textContent='⏸ Pause';
            message('Video chal raha hai');
        }else{
            v.pause();
            $('#play').textContent='▶ Play';
            message('Video pause hai');
        }
    }catch(err){
        console.error(err);
        $('#play').textContent='▶ Play';
        message('Video play nahi hua: ' + err.message);
    }
}
v.ontimeupdate=()=>{
updateClock();
if(v.currentTime>=+$('end').value&&!v.paused){v.pause();$('play').textContent='▶ Play'}
};
v.onpause=()=>$('play').textContent='▶ Play';
function seek(n){if(v.src)v.currentTime=Math.max(+$('start').value,Math.min(+$('end').value,v.currentTime+n))}
function splitClip(){
if(!v.src){message('Pehle video import karein.');return}
if(v.currentTime<=+$('start').value||v.currentTime>=+$('end').value){message('Playhead ko video ke beech mein rakhein.');return}
splits.push(v.currentTime);message('Split marker '+time(v.currentTime)+' par add hua. Full multi-clip editing abhi develop honi baaki hai.');
}
function deleteClip(){
if(!v.src)return;v.pause();v.removeAttribute('src');v.load();v.hidden=true;
$('empty').hidden=false;$('videoClip').textContent='Import video to begin';
$('videoClip').classList.add('emptyclip');$('filename').textContent='Your media will appear here.';
message('Clip removed.');
}
function showTab(tab,button){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));button.classList.add('active');
$('mediaPane').hidden=tab!=='media';$('toolPane').hidden=tab==='media';
$('toolPane').textContent=({audio:'♫ Music and audio tools — next update',text:'🔤 Text overlay ke liye right panel ka Text Overlay use karein.',effects:'✨ Filters ke liye right panel ka Filter use karein.'})[tab];
}
async function exportVideo(){
if(!v.src){message('Pehle video import karein.');return}
const capture=v.captureStream||v.mozCaptureStream;
if(!capture||!window.MediaRecorder){message('Latest Chrome browser try karein.');return}
const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));
if(!mime){message('WebM export supported nahi hai.');return}
let rec,chunks=[];
try{
v.pause();
const target=+$('start').value;
if(Math.abs(v.currentTime-target)>.05){
await new Promise((resolve,reject)=>{
const timer=setTimeout(()=>reject(Error('Seek timeout')),5000);
v.onseeked=()=>{clearTimeout(timer);resolve()};
v.currentTime=target;
});
}
rec=new MediaRecorder(capture.call(v),{mimeType:mime});
rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
rec.onstop=()=>{
const blob=new Blob(chunks,{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');
a.href=url;a.download='AI-Video-Studio-Export.webm';a.click();
setTimeout(()=>URL.revokeObjectURL(url),60000);message('Export complete! WebM video download ho gayi.');
};
rec.start();v.playbackRate=+$('speed').value;v.volume=+$('volume').value;
await v.play();message('Export chal raha hai. Video real time mein chalega; tab khula rakhein.');
const stop=()=>{if(v.currentTime>=+$('end').value){v.pause();v.removeEventListener('timeupdate',stop);if(rec.state!=='inactive')rec.stop()}};
v.addEventListener('timeupdate',stop);
}catch(e){message('Export error: '+e.message);if(rec&&rec.state!=='inactive')rec.stop()}
}
</script>
</body>
</html>
